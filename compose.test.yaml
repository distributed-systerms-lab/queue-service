# Disposable dependencies for integration tests. Loopback ports are a deliberate
# test-only exception; the application's compose.yaml publishes no host ports.
name: queue-service-tests
services:
  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: queue-tests-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab-test-only
    ports: ["127.0.0.1:5672:5672"]
    healthcheck:
      test: [CMD-SHELL, "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-test-only
      POSTGRES_DB: queue_lab
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d queue_lab]
      interval: 3s
      timeout: 3s
      retries: 30
