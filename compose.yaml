name: queue-service

x-application: &application
  image: queue-service:local
  build: .
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 20s
  mem_limit: 256m
  cpus: 1.0
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

x-environment: &environment
  AMQP_URL: amqp://${RABBITMQ_USER:-lab}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
  QUEUES: ${QUEUES:-tasks}
  QUEUE_NAME: ${QUEUE_NAME:-tasks}
  MAX_RETRIES: ${MAX_RETRIES:-3}
  MAX_QUEUE_LENGTH: ${MAX_QUEUE_LENGTH:-100000}
  OPERATION_TIMEOUT: ${OPERATION_TIMEOUT:-5s}

services:
  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [private]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: [CMD-SHELL, "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: queue_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d queue_lab]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  queue-service:
    <<: *application
    command: [serve]
    environment:
      <<: *environment
      GRPC_ADDRESS: :50051
      PUBLISH_CONCURRENCY: ${PUBLISH_CONCURRENCY:-32}
      SHUTDOWN_TIMEOUT: 15s
    networks:
      private: {}
      messaging:
        aliases: [queue-service]
    depends_on:
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, /queue-service, health]
      interval: 5s
      timeout: 3s
      retries: 6

  consumer:
    <<: *application
    command: [worker]
    environment:
      <<: *environment
      DATABASE_URL: postgres://lab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/queue_lab?sslmode=disable
      CONCURRENCY: ${CONCURRENCY:-4}
      RETRY_DELAY: ${RETRY_DELAY:-1s}
      PROCESSING_DELAY: ${PROCESSING_DELAY:-0s}
      ACKNOWLEDGMENT_DELAY: ${ACKNOWLEDGMENT_DELAY:-0s}
    networks: [private]
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}

networks:
  private:
    internal: true
  messaging:
    external: true
    name: ${LAB_NETWORK:-lab-messaging}

volumes:
  rabbitmq-data:
  postgres-data:
